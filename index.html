<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio | Neapolitan</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap');
      :root {
        /* Color Palette */
        --bg-pink: #fadadd;
        --plaid-brown: rgba(92, 64, 51, 0.12);
        --dark-chocolate: #4a3022; 
        --inner-cream: #fff5f5;
        --text-brown: #5c4033;
        --button-pink: #f4c2c2;
        --accent-pink: #dca3a3;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: var(--bg-pink);
        background-image: 
          repeating-linear-gradient(90deg, transparent, transparent 40px, var(--plaid-brown) 40px, var(--plaid-brown) 42px),
          repeating-linear-gradient(180deg, transparent, transparent 40px, var(--plaid-brown) 40px, var(--plaid-brown) 42px);
        font-family: 'Georgia', serif; 
        color: var(--text-brown);
        padding: 40px 20px;
      }

      #root {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Top Navigation */
      .navigation {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 30px;
      }

      .nav-btn {
        background-color: var(--inner-cream);
        color: var(--dark-chocolate);
        padding: 10px 30px;
        border-radius: 20px;
        text-decoration: none;
        font-size: 1.1rem;
        font-weight: bold;
        border: 2px solid var(--dark-chocolate);
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .nav-btn:hover, .nav-btn.active {
        background-color: var(--button-pink);
        transform: translateY(-3px);
        box-shadow: 0 4px 10px rgba(74, 48, 34, 0.2);
      }

      /* Main Floating Container */
      .main-container {
        background-color: var(--dark-chocolate);
        width: 96%;
        max-width: 1800px;
        border-radius: 30px;
        padding: 20px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        box-sizing: border-box;
      }

      /* Inner Scrapbook Area */
      .inner-content {
        background-color: var(--inner-cream);
        border-radius: 20px;
        border: 3px dashed var(--accent-pink);
        padding: 30px;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
      }
      
      .inner-content.home-view { gap: 30px; }
      .inner-content.gallery-view { gap: 20px; }
      .inner-content.fun-view { gap: 50px; padding: 40px; }
      .inner-content.project-view { gap: 30px; padding: 40px; align-items: center; }

      /* ---------------- HOME SPECIFIC ---------------- */
      .banner-area {
        width: 100%;
        height: 200px;
        background-color: var(--bg-pink);
        border: 2px solid var(--dark-chocolate);
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-brown);
        font-weight: bold;
        font-size: 1.2rem;
        overflow: hidden;
      }

      .about-split {
        display: flex;
        gap: 30px;
        align-items: stretch;
      }

      .profile-pic-area {
        flex: 0 0 250px;
        height: 250px;
        background-color: var(--button-pink);
        border: 2px solid var(--dark-chocolate);
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
      }

      .text-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .text-box {
        margin-bottom: 20px;
      }

      h1.home-title {
        margin: 0 0 10px 0;
        font-family: 'Caveat', cursive;
        color: var(--accent-pink);
        text-shadow: 2px 2px 0px var(--dark-chocolate);
        font-size: 3.5rem;
        font-weight: 700;
        line-height: 1;
      }

      .custom-divider {
        height: 20px;
        background-color: var(--plaid-brown);
        margin: 15px 0;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
      }

      .software-wrapper {
        background-color: rgba(255,255,255,0.5);
        border: 1px solid var(--accent-pink);
        border-radius: 15px;
        padding: 15px;
      }

      .software-wrapper h3 {
        margin: 0 0 10px 0;
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .software-grid {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
      }

      .software-icon {
        width: 40px;
        height: 40px;
        background-color: var(--button-pink);
        border: 1px solid var(--dark-chocolate);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
        font-weight: bold;
      }

      .links-footer {
        display: flex;
        justify-content: center;
        gap: 15px;
        padding-top: 20px;
        border-top: 2px dotted var(--accent-pink);
      }

      .link-icon {
        width: 50px;
        height: 50px;
        background-color: var(--button-pink);
        border: 2px solid var(--dark-chocolate);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s;
      }

      .link-icon:hover {
        transform: scale(1.1);
      }

      @media (max-width: 768px) {
        .about-split {
          flex-direction: column;
          align-items: center;
        }
        .profile-pic-area {
          width: 100%;
          max-width: 300px;
        }
        .nav-btn {
          padding: 8px 15px;
          font-size: 0.9rem;
        }
      }

      /* ---------------- GALLERY SPECIFIC ---------------- */
      .filter-tabs {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 30px;
        border-bottom: 4px solid var(--dark-chocolate);
        padding-bottom: 0px;
        padding-top: 10px;
      }

      .tab {
        background-color: var(--button-pink);
        border: 4px solid var(--dark-chocolate);
        color: var(--text-brown);
        padding: 10px 25px;
        border-radius: 15px 15px 0 0; 
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
        margin-bottom: -4px; /* Pull down over the border */
        z-index: 1;
        opacity: 0.8;
      }

      .tab:hover {
        background-color: var(--accent-pink);
        opacity: 1;
      }
      
      .tab.active-tab {
        background-color: var(--inner-cream); /* Matches the inner content background */
        border-bottom: 4px solid var(--inner-cream); /* Hides the dark line below it */
        color: var(--dark-chocolate);
        z-index: 2;
        opacity: 1;
      }

      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 35px;
      }

      .project-card {
        background-color: #ffffff;
        border: 3px solid var(--dark-chocolate);
        border-radius: 16px;
        padding: 16px;
        padding-bottom: 35px;
        box-shadow: 6px 6px 0px var(--accent-pink);
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
      }
      
      .project-card::after {
        content: '✿';
        position: absolute;
        bottom: 4px;
        color: var(--accent-pink);
        font-size: 1.4rem;
        transition: color 0.3s ease;
      }

      .project-card:hover {
        transform: translateY(-8px) scale(1.02) rotate(-2deg);
        box-shadow: 10px 10px 0px var(--dark-chocolate);
      }
      
      .project-card:hover::after {
        color: var(--dark-chocolate);
      }

      .thumbnail-placeholder {
        width: 100%;
        aspect-ratio: 4 / 3;
        background-color: var(--inner-cream);
        background-image: radial-gradient(var(--bg-pink) 2px, transparent 2px);
        background-size: 16px 16px;
        border: 2px dashed var(--accent-pink);
        border-radius: 8px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-brown);
        font-family: 'Caveat', cursive;
        font-size: 1.4rem;
        text-align: center;
        padding: 10px;
        box-sizing: border-box;
      }

      .project-title {
        font-family: 'Caveat', cursive;
        font-size: 1.8rem;
        font-weight: 700;
        text-align: center;
        line-height: 1.1;
        color: var(--accent-pink);
        text-shadow: 1px 1px 0px var(--dark-chocolate);
      }

      @media (max-width: 600px) {
        .gallery-grid {
          grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
          gap: 20px;
        }
      }

      /* ---------------- FOR FUN SPECIFIC ---------------- */
      .page-title {
        text-align: center;
        font-family: 'Caveat', cursive;
        font-size: 4rem;
        font-weight: 700;
        color: var(--accent-pink);
        text-shadow: 2px 2px 0px var(--dark-chocolate);
        margin: 0 0 -20px 0;
      }

      .zigzag-row {
        display: flex;
        gap: 30px;
        align-items: center;
      }

      .zigzag-row.reverse {
        flex-direction: row-reverse;
      }

      .zz-image-box {
        flex: 0 0 350px;
        background-color: var(--inner-cream);
        background-image: radial-gradient(var(--bg-pink) 2px, transparent 2px);
        background-size: 16px 16px;
        border: 3px solid var(--dark-chocolate);
        border-radius: 20px;
        box-shadow: 8px 8px 0px var(--accent-pink);
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-family: 'Caveat', cursive;
        font-size: 1.8rem;
        color: var(--text-brown);
        padding: 20px;
        text-align: center;
        overflow: hidden;
      }

      .zz-text-box {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .zz-text-box h2 {
        margin: 0 0 10px 0;
        font-family: 'Caveat', cursive;
        font-size: 2.5rem;
        line-height: 1;
        color: var(--dark-chocolate);
        border-bottom: 2px dotted var(--accent-pink);
        padding-bottom: 5px;
        display: inline-block;
      }

      .zz-text-box p {
        line-height: 1.6;
        margin-bottom: 15px;
      }

      ul.custom-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      ul.custom-list li {
        padding: 5px 0;
        border-bottom: 1px solid var(--plaid-brown);
      }

      ul.custom-list li::before {
        content: "♡ "; /* Cute custom bullet point */
        color: var(--accent-pink);
      }

      @media (max-width: 768px) {
        .zigzag-row, .zigzag-row.reverse {
          flex-direction: column;
          text-align: center;
        }
        .zz-image-box {
          width: 100%;
          flex: none;
          max-width: 350px;
          margin: 0 auto;
        }
        .zz-text-box h2 {
          margin-top: 15px;
        }
        ul.custom-list li {
          text-align: left;
        }
      }

      /* ---------------- PROJECT VIEW SPECIFIC ---------------- */
      .top-bar {
        width: 96%;
        max-width: 1800px;
        display: flex;
        justify-content: flex-start;
        margin-bottom: 20px;
      }

      .back-btn {
        background-color: var(--inner-cream);
        color: var(--dark-chocolate);
        padding: 8px 25px;
        border-radius: 20px;
        text-decoration: none;
        font-size: 1rem;
        font-weight: bold;
        border: 2px solid var(--dark-chocolate);
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
      }

      .back-btn:hover {
        background-color: var(--button-pink);
        transform: translateY(-3px);
        box-shadow: 0 4px 10px rgba(74, 48, 34, 0.2);
      }

      .project-header {
        text-align: center;
        width: 100%;
        border-bottom: 3px dotted var(--accent-pink);
        padding-bottom: 25px;
      }

      .project-header h1 {
        margin: 0 0 10px 0;
        font-family: 'Caveat', cursive;
        color: var(--accent-pink);
        text-shadow: 2px 2px 0px var(--dark-chocolate);
        font-size: 5rem;
        font-weight: 700;
        line-height: 1;
      }

      .project-meta {
        font-size: 1.1rem;
        font-family: 'Arial', sans-serif;
        color: var(--text-brown);
        opacity: 0.9;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: bold;
      }

      .showcase-area {
        width: 100%;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-brown);
        font-size: 1.2rem;
        font-weight: bold;
        text-align: center;
        box-sizing: border-box;
      }

      .showcase-area img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 15px;
        border: 3px solid var(--dark-chocolate);
      }

      .project-footer {
        width: 100%;
        display: flex;
        justify-content: flex-end;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 3px dotted var(--accent-pink);
      }

      .next-btn {
        background-color: var(--button-pink);
        color: var(--dark-chocolate);
        padding: 12px 35px;
        border-radius: 25px;
        text-decoration: none;
        font-size: 1.1rem;
        font-weight: bold;
        border: 2px solid var(--dark-chocolate);
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .next-btn:hover {
        transform: translateX(5px) scale(1.05);
        box-shadow: -4px 4px 10px rgba(74, 48, 34, 0.2);
        background-color: var(--accent-pink);
        color: var(--inner-cream);
      }

      @media (max-width: 768px) {
        .inner-content.project-view {
          padding: 20px;
        }
        .project-header h1 {
          font-size: 3rem;
        }
      }

      /* ---------------- NEW PROJECT TYPES SPECIFIC ---------------- */
      .placeholder-image {
        width: 100%;
        min-height: 500px;
        background-color: var(--inner-cream);
        background-image: radial-gradient(var(--bg-pink) 2px, transparent 2px);
        background-size: 20px 20px;
        border: 3px solid var(--dark-chocolate);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-brown);
        font-family: 'Caveat', cursive;
        font-size: 2.5rem;
        padding: 30px;
        box-sizing: border-box;
        box-shadow: 8px 8px 0px var(--accent-pink);
      }
      
      .graphic-showcase {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 40px;
      }

      .before-after-wrapper {
        display: flex;
        width: 100%;
        gap: 30px;
      }

      .ba-side {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }

      .ba-label {
        font-family: 'Caveat', cursive;
        font-size: 3.5rem;
        color: var(--accent-pink);
        text-shadow: 2px 2px 0px var(--dark-chocolate);
        font-weight: bold;
        line-height: 1;
      }

      .ba-image {
        min-height: 400px;
      }

      .video-wrapper {
        width: 100%;
        border: 4px solid var(--dark-chocolate);
        border-radius: 20px;
        overflow: hidden;
        background-color: var(--dark-chocolate);
        display: flex;
        box-shadow: 8px 8px 0px var(--accent-pink);
      }
      
      .video-wrapper video {
        width: 100%;
        display: block;
      }

      .banner-area.clickable {
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .banner-area.clickable:hover {
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(74, 48, 34, 0.2);
        border-color: var(--accent-pink);
      }

      @media (max-width: 768px) {
        .before-after-wrapper {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
